name: Ensure handoff.js in index.html

on:
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[handoff-bot]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Check and inject handoff.js tag
        id: check
        run: |
          if grep -q 'src="handoff.js"' index.html; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            python3 - << 'PYEOF'
          src = open('index.html', encoding='utf-8', errors='replace').read()
          idx = src.rfind('</body>')
          if idx == -1:
              raise SystemExit('No </body> found')
          patched = src[:idx] + '<script src="handoff.js"></script>\n' + src[idx:]
          open('index.html', 'w', encoding='utf-8').write(patched)
          print('Injected.')
          PYEOF
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.present == 'false'
        run: |
          git config user.name  "handoff-bot"
          git config user.email "handoff-bot@users.noreply.github.com"
          git add index.html
          git commit -m "[handoff-bot] Restore handoff.js script tag"
          git push origin main
