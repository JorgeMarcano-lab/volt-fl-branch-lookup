name: Ensure handoff.js in index.html

on:
  push:
    branches: [main]
    paths: [index.html]

jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[handoff-bot]')"
    steps:
      - uses: actions/checkout@v4
      - name: Restore handoff.js if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/workflows/patch_handoff.py
